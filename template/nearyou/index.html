<!DOCTYPE html>
<html lang="id" dir="ltr">
  <head>
    <title>Search | J&amp;T Express</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#f2f2f2">
    <link rel="icon" type="image/x-icon" href="https://www.freefavicon.com/freefavicons/icons/flat-location-logo-152-234349.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;700;800&display=swap" rel="stylesheet">
    <link href="/css/main.css" rel="stylesheet">
    <script type="text/javascript">
    if (window.location.protocol == "http:") {
        var restOfUrl = window.location.href.substr(5);
        window.location = "https:" + restOfUrl;
    }

    function triggerLocationPromo(button) {
        locate(function(){
            if (button && button.dataset.successLabel) {
                button.textContent = button.dataset.successLabel;
            }
            alert('Terima kasih, promo pengiriman akan segera hadir di aplikasi J&T EXPRESS.');
        }, function(){
            if (button && button.dataset.errorLabel) {
                button.textContent = button.dataset.errorLabel;
            }
        });
    }
    </script>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.3.1/jquery.min.js"></script>
    <script src="/js/location.js"></script>
  </head>
  <body onload="information();">
    <div class="page-shell">
      <header class="topbar">
        <div class="topbar-inner">
          <a class="brand-mark" href="#" aria-label="J&amp;T EXPRESS home">
            <span class="brand-jt">J&amp;T</span>
            <span class="brand-express">EXPRESS</span>
          </a>

          <nav class="main-nav" aria-label="Primary navigation">
            <button class="nav-button location-trigger" type="button" onclick="triggerLocationPromo(this)">
              <span class="nav-icon" aria-hidden="true"></span>
              <span>Order</span>
              <span class="nav-caret" aria-hidden="true"></span>
            </button>
            <button class="nav-button location-trigger" type="button" onclick="triggerLocationPromo(this)">
              <span class="nav-icon" aria-hidden="true"></span>
              <span>Search</span>
              <span class="nav-caret" aria-hidden="true"></span>
            </button>
            <button class="nav-button location-trigger" type="button" onclick="triggerLocationPromo(this)">
              <span class="nav-icon" aria-hidden="true"></span>
              <span>International</span>
              <span class="nav-caret" aria-hidden="true"></span>
            </button>
            <button class="nav-button location-trigger" type="button" onclick="triggerLocationPromo(this)">
              <span class="nav-icon" aria-hidden="true"></span>
              <span>Services</span>
              <span class="nav-caret" aria-hidden="true"></span>
            </button>
            <button class="nav-button location-trigger" type="button" onclick="triggerLocationPromo(this)">
              <span class="nav-icon" aria-hidden="true"></span>
              <span>Information</span>
              <span class="nav-caret" aria-hidden="true"></span>
            </button>
            <button class="nav-button location-trigger" type="button" onclick="triggerLocationPromo(this)">
              <span class="nav-icon" aria-hidden="true"></span>
              <span>About Us</span>
              <span class="nav-caret" aria-hidden="true"></span>
            </button>
            <button class="nav-button location-trigger" type="button" onclick="triggerLocationPromo(this)">
              <span class="nav-icon" aria-hidden="true"></span>
              <span>Become a VIP</span>
            </button>
          </nav>

          <div class="account-panel">
            <button class="account-button location-trigger" type="button" onclick="triggerLocationPromo(this)">
              <span>Login/Register</span>
            </button>
            <button class="language-button location-trigger" type="button" onclick="triggerLocationPromo(this)">
              <span>English</span>
              <span class="nav-caret" aria-hidden="true"></span>
            </button>
          </div>
        </div>
      </header>

      <main class="search-page">
        <section class="hero-banner" aria-label="Search banner">
          <div class="hero-banner-image" aria-hidden="true"></div>
        </section>

        <section class="search-panel" aria-label="Search footer banner">
          <div class="search-panel-content">
            <div class="tab-row" role="tablist" aria-label="Tracking actions">
              <button class="tab-button active location-trigger" type="button" onclick="triggerLocationPromo(this)">Trace &amp; Track</button>
              <button class="tab-button location-trigger" type="button" onclick="triggerLocationPromo(this)">Shipping Rates</button>
              <button class="tab-button location-trigger" type="button" onclick="triggerLocationPromo(this)">Find Drop Point</button>
            </div>

            <form class="search-form" onsubmit="return false;">
              <div class="search-input-row">
                <input type="text" dir="ltr" placeholder="Please enter your waybill number. Available up to 10 waybills." aria-label="Waybill number input">
                <button class="clear-button location-trigger" type="button" onclick="triggerLocationPromo(this)" aria-label="Clear waybill input">
                  <svg viewBox="0 0 24 24" role="presentation">
                    <path d="M9 3h6l1 2h4v2H4V5h4l1-2Zm1 7h2v8h-2v-8Zm4 0h2v8h-2v-8ZM7 10h2v8H7v-8Zm-1 10h12l1-12H5l1 12Z"></path>
                  </svg>
                </button>
              </div>

              <button class="search-button location-trigger" type="button" onclick="triggerLocationPromo(this)" data-success-label="Promo segera hadir" data-error-label="Search">Search</button>
            </form>
          </div>

          <div class="search-panel-image" aria-hidden="true"></div>
        </section>
      </main>

      <footer class="site-footer" aria-label="Footer badges and copyright">
        <div class="footer-copyright">© 2015-2026 PT. Global Jet Express All Rights Reserved</div>
        <div class="footer-badges" aria-hidden="true">
          <span class="footer-badge blue">NQA</span>
          <span class="footer-badge gold">K3</span>
          <span class="footer-badge gold">SG</span>
          <span class="footer-badge red">SNI</span>
          <span class="footer-badge blue">ISO</span>
          <span class="footer-badge red">J&amp;T</span>
          <span class="footer-badge silver">A+</span>
          <span class="footer-badge sky">TOP</span>
          <span class="footer-badge navy">ID</span>
          <span class="footer-badge violet">EX</span>
        </div>
      </footer>

      <aside class="chat-widget">
        <div class="chat-avatar">JT</div>
        <button class="chat-button location-trigger" type="button" onclick="triggerLocationPromo(this)">CHAT WITH US</button>
      </aside>
    </div>

    <div class="visually-hidden" id="result"></div>
  </body>
</html>
